# Hartwell assessment inventory, September 2027 (synthetic).
# Compiled by Tom Reilly's people analytics team for Daniel
# Brooks. One row per method that informs a hiring or
# promotion decision. meta: the method class in the 2022
# validity reanalysis the book cites (Sackett and others,
# Table 3); estimate is that table's mean operational
# validity for the class, not a Hartwell measurement.
# evidence: local = a content or criterion study on Hartwell
# jobs; vendor = a vendor study on other employers; none.
# impact: current, due (new version, first table due) or
# none, from the Chapter 7 step register.
methods:
  - id: M1
    name: Field technician structured interview (FT-SI v1)
    used: US field hiring
    meta: structured interview
    estimate: 0.42
    tasks: [T01, T02, T03, T04, T05, T06, T09, T11, T12]
    evidence: local
    impact: due
    adjustments: true
    infers: []
    owner: Daniel Brooks
    review: 2028-09-30
