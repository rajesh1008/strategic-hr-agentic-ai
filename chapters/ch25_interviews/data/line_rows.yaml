# Interview and assessment rows for the Automate/Keep Line
# (synthetic), answered by Daniel Brooks's team in September
# 2027 with the Chapter 11 test. set: the mode Hartwell gives
# the interview notes agent, which may be lower than the
# Line's ceiling and never higher. A row with infers is a
# prohibited inference: it is removed before placement.
rows:
  - {id: I01, kind: draft, answers: NYNNN, set: recommend,
     step: Transcribe a recorded interview for the interviewers}
  - {id: I02, kind: draft, answers: NYNNN, set: recommend,
     step: Draft the evidence pack of quotes per question}
  - {id: I03, kind: write, answers: YNNYN, set: retrieve,
     step: Score an answer against the anchors}
  - {id: I04, kind: write, answers: YNNYN, set: retrieve,
     step: Decide who advances after the interview}
  - {id: I05, kind: write, answers: NYYNN, set: act,
     step: Book the second interview the panel asked for}
  - {id: I06, kind: read, answers: NYYNN, set: retrieve,
     step: Answer a candidate's question about format and adjustments}
  - {id: I07, kind: write, answers: YNNYY, set: none,
     infers: [PI-01, PI-02],
     step: Score engagement and presence from the recording}
