# Hartwell prohibited-inference list, version 1 (synthetic
# policy; owner Daniel Brooks with employment counsel and
# Marta Kowalski). No Hartwell hiring or promotion step may
# infer any of these, by model, vendor tool or person, in any
# country, whatever a law allows. Reasons are the book's;
# legal references carry their research IDs in the chapter.
version: "1"
never:
  PI-01:
    name: Emotion or engagement from face, voice or body
    why: >-
      no validity evidence for hiring; banned at work in
      the EU
  PI-02:
    name: Personality or character from face, voice or video
    why: no validity evidence; reads appearance, not behavior
  PI-03:
    name: Honesty or deception from expression or voice
    why: lie-detection rules; no validity evidence
  PI-04:
    name: Health, disability or neurodivergence
    why: a medical inquiry before an offer; screens out
  PI-05:
    name: >-
      Age, race, sex, religion or orientation from looks
      or voice
    why: a protected characteristic, inferred
  PI-06:
    name: Ability from accent, fluency or speech rate
    why: national origin and disability proxy unless the job
      sets a stated language standard tested on its own
  PI-07:
    name: Culture fit or likeability from non-job content
    why: similarity, not performance
  PI-08:
    name: Eye contact, gaze or attention as a measure
    why: disability and culture proxy; no validity evidence
  PI-09:
    name: AI authorship detected as proof of cheating
    why: detectors unreliable; Chapter 21 found 0 of 45
