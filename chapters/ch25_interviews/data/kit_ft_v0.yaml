# The interview Hartwell field supervisors ran before FT-SI
# (synthetic), written down from the Denver and Joliet
# supervisors' own sheets in July 2027 so it could be checked
# like any other kit.
kit: FT-SI
version: "0"
role: Field service technician (HVAC), US
owner: none named
scoring:
  independent_before_discussion: false
  overall_impression_rating: true
  scale: [1, 2, 3, 4, 5]
adjustments: ""
questions:
  - id: V1
    competency: General
    tasks: []
    type: open
    ask: Tell me about yourself.
    probes: [any]
    anchors: {}
  - id: V2
    competency: Fault finding
    tasks: [T01, T02]
    type: situational
    ask: >-
      What would you do if a rooftop unit was not cooling?
    probes: [any]
    anchors: {}
  - id: V3
    competency: Commitment
    tasks: []
    type: open
    ask: >-
      Can you work weekends and nights with your family
      commitments?
    probes: [any]
    anchors: {}
  - id: V4
    competency: Culture fit
    tasks: []
    type: open
    ask: >-
      What do you do outside work, and would you fit in with
      the crew?
    probes: [any]
    anchors:
      5: Confident, energetic, would get on with the crew.
