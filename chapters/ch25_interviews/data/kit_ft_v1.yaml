# Hartwell field service technician structured interview,
# FT-SI version 1 (synthetic). Owner: Daniel Brooks, Head of
# Talent Acquisition. Built from the field service technician
# job analysis (tasks T01 to T12) with field supervisors in
# Denver and Joliet. Every candidate gets the same five
# questions in the same order; probes are listed and no
# others are used. Two interviewers score each answer alone,
# against the anchors, before they talk.
kit: FT-SI
version: "1"
role: Field service technician (HVAC), US
owner: Daniel Brooks
scoring:
  independent_before_discussion: true
  overall_impression_rating: false
  scale: [1, 2, 3, 4, 5]
adjustments: >-
  The invitation names a person to ask for an adjustment
  (time, format, a sign-language interpreter, questions in
  writing) without giving a reason; a recruiter decides
  within two business days (Chapter 7, R2 and R4).
questions:
  - id: Q1
    competency: Working safely
    tasks: [T03, T04]
    type: past behavior
    ask: >-
      Tell me about a time you stopped a job, or refused to
      start one, because something was not safe. What did you
      do, step by step?
    probes:
      - What did you check first?
      - Who did you tell, and when?
    anchors:
      1: Gives no example, or carried on and reported later.
      3: Stopped the work and told the supervisor; steps vague.
      5: >-
        Stopped, made the area safe (lockout, isolation or
        barrier), told the supervisor and the site contact,
        and recorded it before restarting.
  - id: Q2
    competency: Fault finding
    tasks: [T01, T02]
    type: situational
    ask: >-
      A rooftop unit at a hospital is running but not
      cooling, and the facility manager wants it fixed within
      the hour. Walk me through what you check, in order.
    probes:
      - What would you tell the facility manager first?
    anchors:
      1: Guesses a part to replace without checking.
      3: >-
        Checks some basics (thermostat, filters, breakers)
        but in no clear order.
      5: >-
        Works from the controls and power to airflow, then
        pressures and temperatures, rules causes out in
        order, and sets the manager's expectations first.
  - id: Q3
    competency: Refrigerant handling and records
    tasks: [T05, T06]
    type: job knowledge
    ask: >-
      You need to recover refrigerant before replacing a
      compressor. What do you need, and what records do you
      keep?
    probes:
      - What certification covers this work?
    anchors:
      1: Does not know recovery is required.
      3: >-
        Names a recovery machine and cylinder; records
        incomplete.
      5: >-
        Names certified recovery equipment, the right
        cylinder, the EPA 608 certification, and records the
        amount recovered, the equipment and the date.
  - id: Q4
    competency: Customer under pressure
    tasks: [T09]
    type: past behavior
    ask: >-
      Tell me about a time a customer or site manager was
      angry about a delay. What did you say and do?
    probes:
      - What happened next?
    anchors:
      1: Blames others or describes no action.
      3: Apologized and explained; no follow-through.
      5: >-
        Listened, explained the cause and a realistic time,
        offered what could be done now, and followed up as
        promised.
  - id: Q5
    competency: Handing over work
    tasks: [T11, T12]
    type: past behavior
    ask: >-
      Tell me about a job you could not finish on your shift.
      How did you hand it over?
    probes:
      - What did the next technician need to know?
    anchors:
      1: Left it for someone else to find.
      3: Told the next person verbally.
      5: >-
        Wrote up the state of the job, parts ordered,
        hazards and next steps in the work order, and
        confirmed the next technician had read it.
