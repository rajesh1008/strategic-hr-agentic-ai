# Who signed Hartwell's Automate/Keep Line, and in what form.
# SYNTHETIC. Invented for the book (Strategic HR and Agentic AI,
# Chapter 32). Areas are Line process areas (A to H).
- signer: Ray Delgado
  body: Union local, Illinois, New York and California
  form: Side letter to the collective agreement, Technology and the Line
  line_version: "1.2"
  date: 2028-03-02
  areas: [C, D, E, G, H]
  conditions:
  - 90 days' notice and the information pack before any new AI step on unit work
  - Joint review twice a year of the Line rows, the register and appeal counts
  - Any row in these areas that moves up a mode needs the local's agreement
- signer: Jeroen de Vries
  body: Ondernemingsraad, Hartwell Netherlands
  form: Council minutes adopting the Line as the reference for consent requests
  line_version: "1.2"
  date: 2028-03-07
  areas: [A, B, C, D, E, F, G, H]
  conditions:
  - Every consent request arrives with the information pack and its Line rows
- signer: Gareth Pryce
  body: Recognized union, Hartwell UK site staff
  form: Technology schedule to the recognition agreement
  line_version: "1.2"
  date: 2028-03-14
  areas: [C, D, E, G, H]
  conditions:
  - The information pack 60 days before any new AI step on site staff
  - G08 notices copied to the representative the employee names
- signer: Katrin Vogel
  body: Betriebsrat, Hartwell Germany
  form: Annex to the works agreement on the skills inventory
  line_version: "1.2"
  date: 2028-05-18
  areas: [A, B, C, D, E, F, G, H]
  conditions:
  - Clauses WA-1 to WA-10 checked on every inventory release
