# Hartwell consequential-decision register, version 1.2 (Chapter 32).
# Version 1.1 plus E03, F02 and G08 (new Keep steps in Line v1.2), and
# a "represented" block on every Keep step that can touch a member of
# Ray Delgado's local (Illinois, New York, California) or of Gareth
# Pryce's recognized union (UK site staff). The block says which
# grievance route a member uses instead of the management appeal,
# who may see the case record, and what the member is told.
# SYNTHETIC. Invented for the book (Strategic HR and Agentic AI).
register: Hartwell consequential-decision register
version: "1.2"
line_version: "1.2"
synthetic: true
routes:
  us_local:
  - {stage: 1, who: Field supervisor with the steward, file_days: 10, answer_days: 5}
  - {stage: 2, who: Field Operations HR lead with the business representative, file_days: 10, answer_days: 10}
  - {stage: 3, who: Joint review, then arbitration notice, file_days: 15, answer_days: 30}
  uk_recognized:
  - {stage: 1, who: Hearing manager with the union representative, file_days: 10, answer_days: 10}
  - {stage: 2, who: Appeal manager with the regional organizer, file_days: 10, answer_days: 10}
represented_areas: [C, D, E, G, H]
entries:
- id: A04
  decider: Recruiter
  reviewer: Hiring manager
  appeal_to: TA operations manager
  window_days: 30
  told: Who reviewed the application, the criteria used, and how to ask for reconsideration
  reasons:
  - minimum requirement not met
  - stronger applicants on stated criteria
  - role closed
- id: A05
  decider: Recruiter
