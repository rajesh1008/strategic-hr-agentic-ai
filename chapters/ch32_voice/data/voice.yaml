# Hartwell's voice map, version 2028-01 (January 2028): every population, the
# channel that speaks for it, and what the law lets that channel
# do about an AI system. right: bargain | consent | consult |
# inform | none (the strongest right the channel holds over a
# new AI step). basis: an evidence-register ID, or VERIFY.
# elected: the contact was chosen by the workers, not appointed
# by management (an HR owner is a contact, not a voice).
# SYNTHETIC headcounts and names (Strategic HR and Agentic AI,
# Chapter 32); totals match running-cases section 1.
populations:
- {id: US-REP, who: "US field staff in the union local (IL, NY, CA)", n: 3900,
   channel: Union local, contact: Ray Delgado, right: bargain, basis: R-259, elected: true}
- {id: US-FLD, who: "US field staff, other states", n: 14600,
   channel: Employee panel, contact: Carla Mendes, right: none, basis: R-479, elected: true}
