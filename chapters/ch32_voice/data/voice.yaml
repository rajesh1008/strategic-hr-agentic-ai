# AI systems in scope and the populations each one touches.
systems:
- {use: skills.suggest, line: [F01, F05], touches: [US-SAL, CA, UK-OTH, NL, DE, AU, HYD]}
- {use: service.actions, line: [H01, C05, D02], touches: [US-REP, US-FLD, US-SAL, CA, UK-REC, UK-OTH]}
- {use: shift.offer, line: [E03], touches: [US-REP]}
