# Source facts for the information pack on two systems, as
# held in the system register in March 2028. A field that is
# absent or empty is missing; the pack will not be issued.
# SYNTHETIC (Strategic HR and Agentic AI, Chapter 32).
skills.suggest:
  purpose: "Suggests skills for a person's profile from their own work records; the person accepts or rejects each one."
  affected: "About 9,000 salaried staff in the US, Canada, the UK, the Netherlands, Germany, Australia and Hyderabad."
  sources: "Project reports, ticket notes, learning records, project roles."
  never_read: "Times, activity data, email, chat, badge and location data, performance ratings."
  readers: "talent.search, mobility.match, learning.recommend. In Germany no other reader; ka.manager elsewhere; perf.pack nowhere."
  line: "F01 automate/draft; F05 automate/retrieve; F02 keep/retrieve (Line v1.2)."
  review: "Nothing enters a profile until the person accepts it. Contact: the HR service desk, then the works council or employee panel."
  tests: "Suggestion acceptance by site, age band and sex, 4,000 suggestions, Feb 2028; no group below 0.8 of the highest."
  monitoring: "Rejections kept 90 days, then counts only. Group counts kept 84 months. Access log read monthly by the Betriebsrat."
  switch_off: "Profile settings, one switch; existing accepted entries stay unless deleted."
shift.offer:
  purpose: "Lists employees on the voluntary overtime list in agreement order for an open shift; the dispatcher makes the offer."
  affected: "About 3,900 field staff in the union local (Illinois, New York, California)."
  sources: "Voluntary overtime list, agreement order, qualifications, availability flag."
  never_read: "Grievance history, union role, sick leave, location outside working time."
  readers: "Dispatch console only."
  line: "E03 keep/recommend (Line v1.2)."
  review: "A bypassed technician can claim the shift's pay under the bypass remedy; steward, business rep, joint review, then arbitration."
  tests: ""
  monitoring: ""
  switch_off: "Not applicable: the ranking is advice to the dispatcher, who may ignore it."
