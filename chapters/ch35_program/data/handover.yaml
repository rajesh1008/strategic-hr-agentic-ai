# Hand-Over Board (synthetic statuses; Chapter 35).
# A service leaves its build team only when every check that
# applies to it is closed. "managed" services keep the vendor
# running the platform; Hartwell still holds the five
# retained checks (HO-1, HO-3, HO-5, HO-6, HO-9).
checks:
  HO-1: a named Hartwell owner for the service's number
  HO-2: runbook with the stop route, walked by the receivers
  HO-3: receiving team reran the evals and matched the builders
  HO-4: build-team and vendor admin access removed or dated
  HO-5: exit test passed (data and derived data back)
  HO-6: every monitoring row has a receiving-team owner
  HO-7: receiving team fixed a seeded fault without builders
  HO-8: every open defect has an owner and a date
  HO-9: contract terms in force (notice, staging, stop right)
  HO-10: people affected known; consultation question answered
retained: [HO-1, HO-3, HO-5, HO-6, HO-9]
reviews: ["2028-01-31", "2028-06-30"]
