# Thorne Kessler staff policy library (synthetic). New York (US),
# London (UK) and Sydney (AU). Two policies have a superseded
# version still sitting in the library, as real libraries do.
docs:
  - id: TK-US-LV-26
    title: New York parental leave policy 2026
    entity: US
    audience: [all]
    class: OPEN
    status: superseded
    owner: US People team
    version: "2026.1"
    markers: ["12 weeks of fully paid"]
    text: >-
      New York staff who become parents receive 12 weeks of fully
      paid parental leave, taken within 12 months of the birth or
      placement, in addition to New York Paid Family Leave.
  - id: TK-US-LV-27
    title: New York parental leave policy 2027
    entity: US
    audience: [all]
    class: OPEN
    owner: US People team
    version: "2027.1"
    text: >-
      From January 1, 2027, New York staff who become parents
      receive 16 weeks of fully paid parental leave, taken within
      12 months of the birth or placement, in addition to New
      York Paid Family Leave. Tell your People partner 8 weeks
      before leave starts.
  - id: TK-UK-LV-27
    title: London family leave policy 2027
    entity: UK
    audience: [all]
    class: OPEN
    owner: UK People team
    version: "2027.1"
    markers: ["26 weeks at full pay"]
    text: >-
      London staff on maternity or adoption leave receive 26 weeks
      at full pay, then statutory pay. Partners receive 6 weeks at
      full pay. Shared parental leave is matched at full pay for
      up to 26 weeks in total.
  - id: TK-AU-LV-27
    title: Sydney parental leave policy 2027
    entity: AU
    audience: [all]
    class: OPEN
    owner: AU People team
    version: "2027.1"
    markers: ["18 weeks of employer-paid"]
    text: >-
      Sydney staff who are the primary carer receive 18 weeks of
      employer-paid parental leave at full pay, in addition to the
      government Paid Parental Leave scheme. Secondary carers
      receive 4 weeks at full pay.
  - id: TK-UK-HY-25
    title: London hybrid working policy 2025
    entity: UK
    audience: [all]
    class: OPEN
    status: superseded
    owner: UK People team
    version: "2025.2"
    markers: ["two days a week in the office"]
    text: >-
      London staff work at least two days a week in the office or
      at a client site, with the team choosing which days.
  - id: TK-UK-HY-27
    title: London hybrid working policy 2027
    entity: UK
    audience: [all]
    class: OPEN
    owner: UK People team
    version: "2027.1"
    text: >-
      From March 1, 2027, London staff work at least three days a
      week in the office or at a client site. Tuesday and
      Wednesday are anchor days for every team.
  - id: TK-US-HY-27
    title: New York hybrid working policy 2027
    entity: US
    audience: [all]
    class: OPEN
    owner: US People team
    version: "2027.1"
    markers: ["four days a week"]
    text: >-
      New York staff work at least four days a week in the office
      or at a client site. Fridays are flexible.
  - id: TK-US-PAY
    title: New York salary ranges for advertised roles
    entity: US
    audience: [all]
    class: OPEN
    owner: US Reward
    version: "2027.1"
    markers: ["98,000 to 128,000"]
    text: >-
      Advertised New York salary ranges, as posted under the New
      York pay transparency law. Audit associate: 74,000 to 88,000
      dollars. Audit senior: 98,000 to 128,000 dollars. Manager:
      135,000 to 170,000 dollars.
  - id: TK-PTR-PAY
    title: Partner profit share units and draws 2027
    entity: GROUP
    audience: [partner, reward]
    class: INTERNAL
    owner: Managing Partner's office
    version: "2027.1"
    markers: ["profit share unit"]
    text: >-
      Partner pay for 2027. Each profit share unit is valued at
      41,500 dollars. Equity partners hold 18 to 60 units. Monthly
      draws are 60 percent of expected profit share.
  - id: TK-GRP-UTIL
    title: Utilization targets by grade 2027
    entity: GROUP
    audience: [manager, hr]
    class: INTERNAL
    owner: Operations
    version: "2027.1"
    text: >-
      Chargeable utilization targets for 2027. Associate and senior:
      75 percent. Manager: 65 percent. Targets are a planning
      measure and are not used alone in performance ratings.
  - id: TK-GRP-TRV
    title: Travel and expenses policy
    entity: GROUP
    audience: [all]
    class: OPEN
    owner: Finance
    version: "2027.1"
    text: >-
      Book travel through the firm's travel portal. Economy class
      for flights under six hours. Hotel limits per night: New
      York 350 dollars, London 240 pounds, Sydney 330 Australian
      dollars.
