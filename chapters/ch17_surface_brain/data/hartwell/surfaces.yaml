# Where people meet the knowledge assistant (synthetic). A
# surface is configured separately from the use it calls; the
# check in surfaces.py compares the two.
surfaces:
  - id: teams-ka-pilot
    name: Microsoft Teams app, manager pilot (40 managers)
    use: ka.manager
    shows_answer_to_user: true
    identity: user sign-in
  - id: askhartwell-window
    name: AskHartwell chat window
    use: ka.employee
    shows_answer_to_user: true
    identity: user sign-in
  - id: hrbp-console
    name: HR partner console
    use: ka.hr
    shows_answer_to_user: true
    identity: user sign-in
  - id: quayfen-desktop
    name: Quayfen adviser desktop (Manila, Cebu)
    use: ka.hr
    shows_answer_to_user: true
    identity: client-issued adviser identity
