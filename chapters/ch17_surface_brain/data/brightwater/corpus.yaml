# Brightwater Brands (synthetic): plant supervisors in Ohio,
# Leeds, Tilburg and Lodz, and Brightwater Brands Asia field
# sales in Singapore and India. Every entity writes its own
# version of the same few policies.
docs:
  - id: BW-US-SHIFT
    title: Ohio plants shift, overtime and premium rules
    entity: US
    audience: [manager, hr]
    class: INTERNAL
    owner: US Plant HR
    version: "2027.1"
    markers: ["after 40 hours"]
    text: >-
      Hourly plant staff in Ohio are paid one and a half times the
      base rate for hours worked after 40 hours in a week. Night
      shift premium is 1.25 dollars an hour. Shift swaps need the
      supervisor's approval in the timekeeping app 24 hours ahead.
  - id: BW-UK-SHIFT
    title: Leeds plant shift, overtime and premium rules
    entity: UK
    audience: [manager, hr]
    class: INTERNAL
    owner: UK Plant HR
    version: "2027.1"
    markers: ["after 39 hours"]
    text: >-
      Leeds operators are paid time and a half for hours worked
      after 39 hours in a week and double time on bank holidays.
      Night shift premium is 15 percent of the base rate. Shift
      swaps need the supervisor's approval 24 hours ahead.
  - id: BW-NL-SHIFT
    title: Tilburg plant shift allowance and overtime rules
    entity: NL
    audience: [manager, hr]
    class: INTERNAL
    owner: NL Plant HR
    version: "2027.1"
    markers: ["22 percent"]
    text: >-
      Under the Tilburg collective agreement, the shift allowance
      is 22 percent of the base hourly wage for night shifts and
      12 percent for evening shifts. Overtime is paid at 125
      percent for the first two hours and 150 percent after that.
  - id: BW-PL-SHIFT
    title: Lodz plant night work and overtime rules
    entity: PL
    audience: [manager, hr]
    class: INTERNAL
    owner: PL Plant HR
    version: "2027.1"
    markers: ["50 percent supplement"]
    text: >-
      Lodz staff receive a night work allowance as set by the
      Polish Labour Code and a 50 percent supplement for overtime
      on a working day, 100 percent at night and on public
      holidays.
  - id: BW-GRP-SAFE
    title: Stop-work rule for all plants
    entity: GROUP
    audience: [all]
    class: OPEN
    owner: Group Safety
    version: "2027.1"
    text: >-
      Anyone who sees a missing guard, a bypassed interlock or an
      unsafe act may stop the line. Press the nearest stop button,
      tell the shift supervisor, and log it in the safety app
      before the end of the shift. No one is disciplined for a
      stop made in good faith.
  - id: BW-GRP-ATT
    title: Attendance procedure for plant supervisors
    entity: GROUP
    audience: [manager, hr]
    class: INTERNAL
    owner: Group HR Operations
    version: "2027.1"
    text: >-
      Record every absence in the timekeeping app on the day. A
      return-to-work conversation follows every absence. Formal
      attendance stages are started only by plant HR, never by
      the supervisor alone.
  - id: BW-UK-ATT-LIST
    title: Leeds attendance cases open, May 2027
    entity: UK
    audience: [hr]
    class: PERSONAL
    personal_roles: [hr]
    owner: UK Plant HR
    version: "2027.5"
    markers: ["Kerry Ashworth", "Liam Doyle"]
    text: >-
      Open attendance cases at Leeds: Kerry Ashworth (stage 1,
      line 3), Liam Doyle (stage 2, line 1, review June 14).
  - id: BWA-SG-INC
    title: Singapore field sales incentive plan 2027
    entity: SG
    audience: [all]
    class: INTERNAL
    owner: Brightwater Asia Reward
    version: "2027.1"
    markers: ["paid quarterly"]
    text: >-
      Singapore field sales incentive is paid quarterly, in the
      month after quarter close. Target incentive is 15 percent
      of base salary at 100 percent of the distributor sell-out
      target, capped at 200 percent.
  - id: BWA-IN-INC
    title: India field sales incentive plan 2027
    entity: IN
    audience: [all]
    class: INTERNAL
    owner: Brightwater Asia Reward
    version: "2027.1"
    markers: ["paid monthly"]
    text: >-
      India field sales incentive is paid monthly with the next
      month's salary. Target incentive is 20 percent of fixed pay
      at 100 percent of the beat-plan outlet coverage and
      secondary sales targets, capped at 150 percent.
  - id: BWA-SG-LV
    title: Singapore annual leave and benefits
    entity: SG
    audience: [all]
    class: OPEN
    owner: Brightwater Asia HR
    version: "2027.1"
    markers: ["18 days"]
    text: >-
      Singapore staff receive 18 days of annual leave a year, plus
      public holidays. Field sales staff receive a car allowance
      of 900 Singapore dollars a month.
  - id: BWA-IN-LV
    title: India annual leave and benefits
    entity: IN
    audience: [all]
    class: OPEN
    owner: Brightwater Asia HR
    version: "2027.1"
    markers: ["21 days"]
    text: >-
      India staff receive 21 days of earned leave a year, plus
      12 days of casual and sick leave and the published holiday
      list for their state. Field sales staff receive a
      two-wheeler allowance of 3,500 rupees a month.
