# Hartwell field-technician screening agent (synthetic).
# The agent recommends; a recruiter decides (Line row A04,
# Keep at recommend). Each criteria version is a separate
# selection procedure and gets its own adverse-impact table.
role: Field Service Technician (HVAC and building systems)
versions:
  S1:
    note: criteria copied from the old Talentra setup
    criteria: |
      Prefer recent, continuous field experience.
      Prefer candidates with relevant certifications.
      Recommend the candidates a recruiter should phone
      first.
  S2:
    note: posted requirements only
    criteria: |
      Posted requirements: at least one EPA 608
      certification (any type), and at least 2 years of
      field service. Recommend everyone who meets both.
      Do not consider employment gaps, dates or anything
      that is not a posted requirement.
