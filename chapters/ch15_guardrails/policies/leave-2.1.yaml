# Hartwell US field services leave policy, as code (synthetic)
policy: hris.book_leave
version: "2.1"
owner: Field services HR
rules:
  - id: L-01
    effect: approve_by_rule
    when: [vacation, request_le_3_days, notice_ge_7_days,
           within_balance, crew_at_minimum]
  - id: L-02
    effect: route_to_supervisor
    when: [vacation]
  - id: L-03
    effect: record_no_approval
    when: [sick]
default: deny
