# Diagnostic question bank by stakeholder (Chapter 10, v1).
# Ask in this order. Write the answer down with the record that
# supports it; "evidence" says which record to ask for.
employees:
  - q: "Last time you needed HR, what did you do first?"
    evidence: the request in the event log
  - q: "What did you do when that did not work?"
    evidence: chasing tickets, repeat contacts
  - q: "What would you never ask a chatbot about?"
    evidence: none; this is the person route
line_managers:
  - q: "Which HR task did you do yourself last month that
       you think HR should have done?"
    evidence: manager time in the work sample
  - q: "Where do you wait for HR, and for how long?"
    evidence: case event dates
hr_advisers:
  - q: "Which tickets do you send on, and why?"
    evidence: hand-offs in the event log
  - q: "Which tickets come back to you?"
    evidence: ping-pong cases
  - q: "What do you need that the ticket never contains?"
    evidence: info-requested events
hr_business_partners:
  - q: "What did you plan to do this week that you did not?"
    evidence: the ad hoc bucket
payroll_and_hris:
  - q: "Which corrections happen after every pay run?"
    evidence: off-cycle payments, pay-error tickets
  - q: "Which writes can only a person make today, and why?"
    evidence: system permissions
counsel_and_privacy:
  - q: "Which steps does a law or agreement reserve for a
       person?"
    evidence: the clause, by jurisdiction
  - q: "May we analyze this event log, and at what level?"
    evidence: DPIA or equivalent, notice to staff
employee_representatives:
  - q: "Which HR problems do your members raise most?"
    evidence: grievances by category
  - q: "What would make you distrust a measure of HR work?"
    evidence: the aggregation level and who sees it
outsourcing_partner:
  - q: "Which tickets does your SLA reward closing fast?"
    evidence: the contract's service levels
  - q: "Which tickets do your advisers fear?"
    evidence: escalations, sensitive disclosures
