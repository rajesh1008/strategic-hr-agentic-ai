# _synthetic: Invented for the book. No real vendor or product.
# Due-diligence pack v1.0 (Hartwell, April 5, 2027): twelve
# checks, each answered with evidence the vendor supplied or
# Hartwell measured. Status per answer: PASS, FIX (closable
# in the contract) or FAIL. Gate checks: any FAIL rejects.
checks:
  DD-01: Every performance claim carries its Claim-Status grade
  DD-02: Impact table per step and version on our records
  DD-03: A per-decision record with inputs, reason and version
  DD-04: Decision records exported daily to our trail
  DD-05: 30 days' notice of model or configuration change
  DD-06: We can switch any AI feature off within 15 minutes
  DD-07: New AI features ship switched off
  DD-08: AI Act roles named; instructions for use supplied
  DD-09: Processor terms; sub-processors and model host listed
  DD-10: No training on our data or decisions without consent
  DD-11: Exit export of all data, decisions and logs, no fee
  DD-12: Writes only through our adapter, own service identity
gates: [DD-02, DD-06, DD-10, DD-12]
vendors:
