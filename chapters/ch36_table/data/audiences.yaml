# Four readers of the same incident (synthetic Hartwell roles).
board:
  reader: "the Hartwell Infrastructure & Services board's audit and risk committee"
  asks: "What happened, what did it cost the people affected, which target did we miss, and what changed?"
  rules: "Lead with the outcome for the 37 people. State the missed target plainly. Name the owner and the record."
regulator:
  reader: "a regulator's written inquiry about the incident"
  asks: "What happened, who was affected, was notification owed and on what reasoning, and what prevents a repeat?"
  rules: "Use dated, timed facts. Say who decided on notification and when. Do not argue the law; report the record."
union:
  reader: "the union local's representative for Hartwell's represented US employees"
  asks: "Were members harmed, did anyone lose pay, and what changed in how the agent and the feed work?"
  rules: "Give counts only; never identify an individual. Say what changed and who to contact."
employee:
  reader: "one of the 37 employees who received the change emails"
  asks: "What happened to my bank details and my pay, and what do I need to do?"
  rules: "Plain words, second person, no internal system names or codes. Tell them their pay date and who answered for it."
