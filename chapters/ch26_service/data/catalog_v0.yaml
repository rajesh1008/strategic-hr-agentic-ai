# AskHartwell controlled-action catalog, draft v0 (synthetic).
# Written December 2027 for the Canada and UK rollout by
# copying the live US rows. Checked by catalog.py.
version: "0"
jurisdictions:
  US: {validator: us_zip, languages: [en], payroll: payroll_ops,
       failure_queue: Denver HR services}
  CA: {validator: ca_postal, languages: [en], payroll: payroll_ops,
       failure_queue: Calgary HR services}
  CA-QC: {validator: ca_postal, languages: [fr, en],
          payroll: payroll_ops,
          failure_queue: Montréal HR services}
  UK: {validator: uk_postcode, languages: [en], payroll: uk_payroll,
       failure_queue: Manchester HR services}
actions:
  - id: AC-ADDR-US
    action: address_change
    where: [US]
    line: {row: SVC-01, ceiling: act}
    mode: act
    approver: rule
    validators: [us_zip]
    readback: normalized
    reversal: rule
    templates: [en]
    owner: Megan Hale
    failure_queue: Denver HR services
