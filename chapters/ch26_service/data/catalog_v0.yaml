    where: [US, CA]
    line: {row: SVC-02, ceiling: act_with_approval}
    mode: act_with_approval
    approver: payroll_ops
    readback: exact
    reversal: payroll_ops
    templates: [en]
    owner: Vikram Desai
    failure_queue: Denver HR services
  - id: AC-BANK-UK
