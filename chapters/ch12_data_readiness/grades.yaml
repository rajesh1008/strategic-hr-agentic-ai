# Hartwell Grades (synthetic): the global architecture designed in
# Denver for HartwellOne's 2016 go-live. Every HartwellOne record
# carries one of these in `grade`. Definitions are the reward team's.
_synthetic: Invented for the book. No real employer.
field:
  F1: Entry field worker. Works under direct supervision; no
      trade certification required.
  F2: Qualified technician. Holds a trade certification and works
      alone on standard planned and reactive jobs.
  F3: Senior technician. Diagnoses complex faults and leads up to
      six people on one site; no budget or hiring authority.
  F4: Field supervisor. Plans work for several crews, signs safety
      permits, approves timesheets, hires and disciplines.
salaried:
  G3: Coordinator or administrator. Follows set procedures.
  G4: Entry professional. Degree or professional qualification;
      works under review.
  G5: Experienced professional. Works independently on own
      projects or accounts.
  G6: Senior professional or team lead of up to eight people.
  G7: Manager. Runs a team or a contract; owns a budget line.
  G8: Senior manager. Runs several teams or a region.
  G9: Director.
