# Lineage of one field: base_pay for a Hartwell UK employee, from the
# moment it is keyed to the letter a lender reads (synthetic). Each
# hop names where the value sits, who answers for it there, the
# control that checks it and the record that proves the hop happened.
_synthetic: Invented for the book. No real employer.
field: S03.base_pay
subject_lane: UK
hops:
