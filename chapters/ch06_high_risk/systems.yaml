# Chapter 6: AI systems that touch Hartwell's EU workforce, and
# the sector cases. ALL SYNTHETIC. Facts are counsel's answers,
# from contracts, product documents and configuration, as of the
# date below. Descriptions are written the way a vendor or an
# internal team describes the product; intake.py shows them to a
# model, never the facts.
as_of: November 9, 2026
annex_iii_from: December 2, 2027   # Reg (EU) 2026/1744 [R-245]

systems:
- id: H1
  name: Hartwell Careers ranking (Smart Shortlist)
  org: Hartwell
  where: [NL, DE]
  description: >-
    Smart Shortlist reads each application and resume against
    the requisition and shows recruiters a ranked list with a
    match score from 0 to 100. Since February 2027 it changes
    no statuses: the rank is a sortable column and recruiters
    read every application. The vendor says the recruiter always
    makes the final decision.
  facts: {ai_system: true, infers_emotion: false,
    medical_or_safety: false, recruit_select: true,
    work_decisions: false, task_allocation: false,
    monitor_evaluate: false, profiling: true,
    narrow_procedural: false, improves_human_work: false,
    pattern_check: false, preparatory: false,
    materially_influences: true}
  role_facts: {built_in_house: false, own_name: false,
    substantial_modification: false}
  decision: {decision_about_person: true,
    significant_effect: true, meaningful_review: true}
  data: {special_category: false, systematic_monitoring: false}
  council_triggers: [selection_guidelines, personal_data,
    new_technology]

