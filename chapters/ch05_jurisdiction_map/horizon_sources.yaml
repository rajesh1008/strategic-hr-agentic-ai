# Four items a horizon scan picked up, as the evidence register
# records them (title, date and claim copied from 01-research
# evidence.jsonl, accessed November 2 and 3, 2026).
- id: R-102
  title: "Connecticut SB 5, Public Act 26-15 (AI Responsibility
    and Transparency), employer provisions (law-firm summary)"
  date: "Signed 29 May 2026; WARN-AI disclosure from 1 Oct 2026;
    AEDT notice from 1 Oct 2027"
  text: "Employers deploying 'automated employment-related
    decision technology' (output is a substantial factor in
    hire/promote/discipline/discharge/terms) must from 1 Oct 2027
    give plain-language interaction disclosure and pre-decision
    written notice (purpose, trade name, data categories and
    sources, contact); AG-only enforcement as unfair trade
    practice, 60-day cure before 31 Dec 2027; AEDT use 'not a
    defense' to discrimination claims, anti-bias testing may
    mitigate; WARN notices must state whether layoffs relate to
    AI from 1 Oct 2026."
- id: R-007
  title: "Newsom Signs McNerney's No Robo Bosses Act of 2026
    Requiring Human Oversight of AI in the Workplace (sponsor's
    press release)"
  date: "30 Sep 2026"
  text: "SB 947 signed 30 Sep 2026; bars California employers
    from relying solely on ADS to fire or discipline workers and
    mandates human oversight and verification when ADS assists
    such decisions; sponsored by California Labor Federation
    AFL-CIO; release cites >550 'bossware' products."
- id: R-041
  title: "Bill C-36 (45-1) Protecting Privacy and Consumer Data
    Act, LEGISinfo"
  date: "first reading 15 Jun 2026"
  text: "Federal privacy reform bill introduced 15 Jun 2026; at
    access still at second reading (no committee, Senate or
    assent)."
- id: R-038
  title: "APP 1.7-1.9 Transparency Obligation Fact Sheet (OAIC)"
  date: "Sep 2026"
  text: "Fact sheet confirms obligations commence 10 Dec 2026 and
    gives recruitment-software examples (algorithmic job-ad
    targeting by age/gender; AI-generated candidate profiles from
    video interviews) as decisions that may significantly affect
    rights or interests."
