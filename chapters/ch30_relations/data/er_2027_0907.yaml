  - id: E03
    kind: system_extract
    source: Station access-control export (client), Gates 1 and 3
    collected_by: Joanne Grieve
    collected_on: 2027-09-09
    text: >-
      Badge HW-032518, August 1 to 31, 2027. Entries recorded on
      Aug 2, Aug 3, Aug 24, Aug 25, Aug 30 and Aug 31. No entry
