      Gate 3 was down for about two weeks in August. We all used
      the side door by the parcel office with the contractor key.
      I was with Gary on one of the lift jobs, the 17th I think.
      I don't know about the other nights.
  - id: E06
    kind: statement
    source: Statement of Sunita Barlow, station duty manager, Sept 16, 2027
    collected_by: Joanne Grieve
    collected_on: 2027-09-16
    signed: true
    text: >-
      I work nights one week in three. I was on duty on August 4,
      5 and 6 and August 25, 26 and 27. I did not see the Hartwell
      technician on any of those nights, but I am not always on the
      concourse. I was not told that Gate 3 was faulty.
