  - id: E04
    kind: interview_notes
    source: Investigation meeting with Gary Whitlock, Sept 14, 2027
    collected_by: Joanne Grieve
    collected_on: 2027-09-14
    signed: true
    text: >-
      GW said he attended every one of the 11 call-outs. Gate 3,
      the staff gate, was not reading badges for about two weeks
      in the middle of August, so on those nights he used the side
      door by the parcel office with the contractor key, which does
      not log. On August 4 he signed the platform office book. On
      August 5 the station's night supervisor let him in through
      Gate 1 on her own badge; he did not know her name. On August
      27 the lift alarm had cleared by the time he arrived; he
      checked the lift panel from the car park level and reset the
      call on his handset without going into the station. He said
      "I've never claimed for a job I didn't go to."
  - id: E05
    kind: statement
    source: Statement of Ian Kershaw, technician, Sept 15, 2027
    collected_by: Joanne Grieve
    collected_on: 2027-09-15
    signed: true
