# Steps a case decision record must show before an outcome,
# by lane (synthetic summary for Chapter 30; Hartwell policy
# where the law sets no step). Every legal reading is marked
# verify until counsel signs it. R-IDs point to 01-research.
US:
  basis: at-will; Hartwell policy sets the steps
  steps: [allegation_put, account_heard, retaliation_check]
US-CA:
  inherits: US
  basis: Labor Code ss.1520-1526.7 (SB 947), from July 1, 2027 [R-248]
  if_ads: [ads_human_corroboration, ads_post_use_notice]
US-UNION:
  inherits: US
  basis: collective agreement; NLRA representation at investigatory interviews [VERIFY]
  steps: [union_rep_offered, agreement_steps]
UK:
  basis: Acas Code of Practice on disciplinary and grievance procedures [VERIFY]; companion right [VERIFY]
  steps: [allegation_in_writing, evidence_shared, meeting_held,
          companion_offered, decision_in_writing, appeal_offered]
DE:
  inherits: UK
  basis: BetrVG s.102 hearing of the works council before notice [VERIFY]
  steps: [works_council_heard_before_notice]
AU:
  basis: Fair Work Act s.387 matters [VERIFY]
  steps: [valid_reason_stated, reason_notified, opportunity_to_respond,
          support_person_allowed]
IN-POSH:
  basis: POSH Act 2013 Internal Committee inquiry and report [VERIFY]
  steps: [ic_inquiry, ic_report_to_employer, employer_action_recorded]
SA:
  basis: Labor Law Art 72 (grievance against a penalty within 30 days, then labor court) [R-332]
  steps: [allegation_put, account_heard, grievance_window_told]
