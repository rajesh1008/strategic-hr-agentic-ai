# Ashby & Lowe disciplinary hearing AL-2027-11 (synthetic).
# A fresh fixture for Chapter 30; the employee and companion
# are role labels and appear nowhere else in the book.
case: AL-2027-11
allegation: >-
  That on October 12, 2027 you operated a counterbalance
  forklift after your internal authorization had lapsed, and
  struck racking in aisle 14.
speakers: {CH: Chair (Rachel Okafor, HR Manager),
           EM: Employee (warehouse operative),
           CO: Companion (colleague)}
transcript:
  - [CH, "This is a disciplinary hearing about what happened on October 12. You've had the investigation report and the photos of aisle 14. You can be accompanied, and you've brought a colleague. Is that right?"]
  - [EM, "Yes."]
  - [CH, "The allegation is that you drove the counterbalance truck after your authorization had lapsed, and that you hit the racking in aisle 14. What do you want to say about that?"]
  - [EM, "I'm not saying I didn't move it. I'm saying nobody told me my authorization had run out. I did the refresher in 2024 and nobody said it was every two years."]
  - [CH, "Did you hit the racking?"]
  - [EM, "The fork caught the upright when I was turning. It was a tight turn because there was a pallet left in the aisle."]
  - [CO, "Can I add something? The truck was booked out to the day shift on the system, so he couldn't have known it was the wrong one. The keys were just left in it."]
  - [CH, "Thank you. Was the pallet there when you started the turn?"]
  - [EM, "Yes. I reported it to the shift lead afterwards."]
  - [CH, "Is there anything else you want me to take into account?"]
  - [EM, "Since my mum's been ill I've been doing doubles to cover. I was tired, I'll be honest. But I've never had a warning in six years."]
  - [CH, "I'm going to adjourn now. I'll consider everything you've said and give you my decision in writing by Friday."]
