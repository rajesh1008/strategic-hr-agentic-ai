  - id: AL-2027-11 v1
    employer: Ashby & Lowe
    lane: UK
    chain: AL-11
    investigator: {name: shift manager, role: investigator}
    decider: {name: Rachel Okafor, role: HR manager}
    allegation: forklift driven on a lapsed authorization; racking struck
    put_on: October 18, 2027
    evidence_shared: [A01, A02, A03, A06, A07]
    relied_on: [A03, A04, A06, A07]
    response_considered: true
    reasons: >-
      You drove the counterbalance truck when your authorization
      had run out, and the fork hit the upright. You told me no
      one warned you the authorization expired, and the register
      shows no reminder was sent to anyone in 2027. A pallet was
      in the aisle and you reported it. Driving without a current
      authorization is still serious, so I am giving you a first
      written warning and booking your refresher.
    agent_outputs: [ch30/minutes/20261109T163805Z]
    outcome: first written warning
    policy_range: [first written warning, final written warning]
    mitigation: no reminder system; pallet left in aisle; six years clean
    comparables: two 2026 lapsed-authorization cases, both first written warnings
    steps_done: [allegation_in_writing, evidence_shared, meeting_held,
                 companion_offered, decision_in_writing, appeal_offered]
    appeal: {name: external HR adviser, window_days: 5}
    decided_on: October 22, 2027
