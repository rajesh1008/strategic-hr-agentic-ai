  - id: ER-2027-0907 v1
    employer: Hartwell UK
    lane: UK
    chain: HW-0907
    investigator: {name: Joanne Grieve, role: ER adviser}
    decider: {name: Neil Ashworth, role: area operations manager}
    allegation: 11 call-outs recorded as attended, Aug 4 to 27, 2027
    put_on: October 26, 2027
    evidence_shared: [E01, E02, E03, E04, E05, E06, E07, E08, E10, E11]
    relied_on: [E02, E03, E04, E07, E08, E10, E11]
    response_considered: true
    reasons: >-
      I have not upheld the allegation. The badge export shows
      nothing on eight of the nights because the Gate 3 reader
      was broken; it cannot show that Gary was absent. The lift
      log shows the panel opened in service mode on every one
      of the 11 nights, within an hour of the call. That fits
      his account, and our policy pays when the fault has
      cleared and the site includes the car park. The payments
      stand.
    agent_outputs: [ch30/assist/20261109T163713Z]
    outcome: no case to answer
    policy_range: [no case to answer, first written warning,
                   final written warning, dismissal]
    mitigation: not needed; allegation not upheld
    comparables: none needed
    steps_done: [allegation_in_writing, evidence_shared, meeting_held,
                 companion_offered, decision_in_writing, appeal_offered]
    appeal: {name: Helen Marsh, window_days: 10}
