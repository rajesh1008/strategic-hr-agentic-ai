# Westbridge City Council FOI request WCC-FOI-2027-1184
# (synthetic). Received by email Monday, November 1, 2027,
# from a local newspaper reporter, about the HR casework
# assistant the three councils bought in 2027 (Chapter 19).
# Hours are the information-governance team's estimates
# (illustrative): with the assistant's trail and records as
# kept, and without them (searching case notes by hand).
received: "2027-11-01"
rate_per_hour_gbp: 25        # rule to verify
limit_gbp: 450               # rule to verify
bank_holidays: ["2027-12-27", "2027-12-28", "2028-01-03"]
items:
  - id: Q1
    asks: name, supplier and purpose of the system
    source: published transparency record (ATRS)
    exemption: none
    hours_trail: 0.25
    hours_without: 0.25
  - id: Q2
    asks: the contract and its price
    source: contract register; award notice
    exemption: s.43 for unit rates only
    hours_trail: 1.0
    hours_without: 1.0
  - id: Q3
    asks: the equality impact assessment
    source: EQIA v2 attached to the casework Line
    exemption: none
    hours_trail: 0.5
    hours_without: 0.5
  - id: Q4
    asks: cases the assistant was used on, by month
    source: trail, count of drafted case notes by month
    exemption: none
    hours_trail: 0.5
    hours_without: 30.0
  - id: Q5
    asks: how often advisers changed its next step
    source: trail, adviser edit field; examples on request,
      redacted
    exemption: s.40(2) for anything that identifies a case
    hours_trail: 1.5
    hours_without: 46.0
  - id: Q6
    asks: the instructions the assistant is given
    source: council-written instructions (contract clause);
      supplier's own system prompt
    exemption: s.43 for the supplier's prompt, public
      interest test
    hours_trail: 2.0
    hours_without: 2.0
