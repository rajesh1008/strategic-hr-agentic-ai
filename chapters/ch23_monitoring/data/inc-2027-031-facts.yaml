# The facts a drafter may use for INC-2027-031 (synthetic).
# Drafts are checked against this list; a number that is not
# here holds the draft for a person.
incident: INC-2027-031
facts:
  - On Tuesday, November 16, 2027 at 6:10 p.m. Denver time,
    Hartwell's evening feed to its US payroll provider sent
    the same batch of approved changes twice after a timeout.
  - 37 employees had a bank-detail change in that batch. The
    provider recorded each of their changes twice and, under
    its own fraud rule for two changes within 24 hours, put
    the new deposit account on hold.
  - Every account was the account the employee had asked for.
    No account details went to anyone who should not have
    them, and no money moved to a wrong account.
  - While on hold, the next pay would have gone by paper
    check instead of direct deposit.
  - Each of the 37 received two emails from the provider
    saying their direct deposit had changed.
  - Hartwell's payroll readback found the problem at 5:42 a.m.
    on Wednesday, November 17. All 37 holds were released and
    read back by 8:02 p.m. that day.
  - Pay on Friday, November 19, 2027 goes by direct deposit to
    the new account as normal. Employees need to do nothing.
  - Questions go to AskHartwell or the HR service line; an
    adviser can confirm the account on file.
  - The feed's automatic retry has been switched off and will
    come back only with a check that stops a batch being sent
    twice.
