     basis: "vendor benchmark, 60% containment"}
  subprocessors: []
  raci:
  - {id: R01, act: Set policy and the Line placement,
     kind: design, R: [Hartwell US], A: Megan Hale}
  - {id: R02, act: Build tools, tests and gate policy,
     kind: build, R: [Hartwell capability center],
     A: Ananya Rao}
  - {id: R03, act: Change an agent tool permission,
     kind: control, R: [Quayfen Outsourcing],
     A: Quayfen Outsourcing}
  - {id: R04, act: Switch the agent off or on, kind: control,
     R: [Quayfen Outsourcing], A: Megan Hale}
  - {id: R05, act: Answer and act on tier-0 requests,
     kind: operate, automate: true, R: [agent],
     A: Megan Hale}
  - {id: R06, act: Take a hand-off and work the case,
     kind: operate, R: [Quayfen Outsourcing], A: Megan Hale}
  - {id: R07, act: Approve a verification letter,
     kind: approve, R: [Quayfen Outsourcing], A: Megan Hale,
     apart_from: R05}
  - {id: R08, act: Approve a bank-details change,
     kind: approve, R: [Quayfen Outsourcing], A: Megan Hale,
     apart_from: R06}
  - {id: R09, act: Detect a wrong action by readback,
     kind: operate, automate: true,
     R: [agent, Quayfen Outsourcing],
     A: Quayfen Outsourcing}
  - {id: R10, act: Correct the record,
     kind: operate, R: [Hartwell capability center],
     A: Megan Hale}
  - {id: R11, act: Tell the employee and put it right,
     kind: operate, R: [Quayfen Outsourcing],
     A: Quayfen Outsourcing}
  - {id: R12, act: Report a personal-data incident,
     kind: operate, R: [Quayfen Outsourcing],
     A: Marta Kowalski}
  - {id: R13, act: Decide leave outside policy, kind: keep,
     R: [agent], A: Megan Hale}
  transfers:
