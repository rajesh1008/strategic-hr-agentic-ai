  incident_notify_hours: 72
  time_to_human_minutes: null
  kpis:
  - {name: Deflection rate, rewards: containment,
     counts: closed by the agent, return_window_days: 0}
  - {name: First response under 60 seconds, rewards: speed}
  seat_cuts:
