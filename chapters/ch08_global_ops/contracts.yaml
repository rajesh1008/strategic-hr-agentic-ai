# Hand-off terms for five outsourcing and capability-center
# arrangements, keyed by the client's procurement team.
# SYNTHETIC. Every organization, person, clause and number is
# invented for the book (Strategic HR and Agentic AI, Chapter 8).
#
# raci: one row per activity around the agent and the human route.
#   R: who does it (entities, "agent" or a role).
#   A: the one named person answerable to the employee.
#   kind: design | build | control | operate | approve | keep
#   automate: true where the Line puts the step on the Automate
#     side; only those rows may name the agent as R.
#   apart_from: an approve row must not share an R with this row.
# agent_owner: client (the client's agent, on the client's model
#   contract) or provider (the supplier's own agent platform, so
#   its model host is the supplier's sub-processor).
# transfers: the data-transfer register rows for this contract.
#   mechanism: what counsel recorded; null means none recorded.
#   The code checks that a mechanism is recorded, never whether
#   it is legally sufficient. That is counsel's call [VERIFY].
rules:
  min_line_notice_days: 30
  max_incident_hours: 24
  min_return_window_days: 7
  seat_cut_status: Measured in production
contracts:

