# System-of-Record Registers (synthetic). One entry per field and
# population: the one system that holds it, who may write it and
# how, every copy, where an agent reads it and any agent store
# that holds it. Hartwell's February 2027 inventory, its April
# 2027 register, and two sector organizations.
_synthetic: Invented for the book. No real employer.
registers:
- org: Hartwell
  version: 2027-02 inventory
  fields:
  - field: home_address
    sor: [HartwellOne]
    writers:
    - {who: employee, via: self-service}
    - {who: vendor chatbot, via: shared integration user}
    copies:
    - {system: US payroll provider, refresh: nightly,
       owner: Country payroll lead, deletion: provider purge}
    - {system: Chatbot vendor cache, refresh: nightly,
       owner: "", deletion: ""}
    agent_reads: Chatbot vendor cache
    agent_acts: true
  - field: bank_account
    sor: [HartwellOne, US payroll provider portal]
    writers:
    - {who: employee, via: self-service}
    - {who: employee, via: provider portal}
    copies: []
    agent_reads: none
    agent_acts: false
  - field: leave_balance
    sor: [HartwellOne]
    writers: [{who: absence module, via: accrual rule}]
    copies:
    - {system: Chatbot vendor cache, refresh: nightly,
       owner: "", deletion: ""}
    agent_reads: Chatbot vendor cache
    agent_acts: false
  - field: manager_id
    sor: [HartwellOne]
    writers: [{who: HR shared services, via: change form}]
    copies:
    - {system: Hartwell Careers, refresh: nightly,
       owner: Head of TA, deletion: Careers purge job}
    agent_reads: HartwellOne
    agent_acts: false
  - field: base_pay
    sor: [HartwellOne]
    writers: [{who: country HR, via: change form}]
    copies:
    - {system: Payroll, refresh: per pay run,
       owner: Country payroll lead, deletion: payroll archive}
    agent_reads: HartwellOne
    agent_acts: false
  - field: job_grade
    sor: [HartwellOne, 2016 crosswalk spreadsheet]
    writers: [{who: reward team, via: change form}]
    copies: []
    agent_reads: HartwellOne
    agent_acts: false
  - field: candidate_status
    sor: [Hartwell Careers]
    writers:
    - {who: recruiter, via: Careers screen}
    - {who: Takefen Smart Shortlist, via: vendor batch}
    copies: []
    agent_reads: Hartwell Careers
    agent_acts: true
  - field: safety_cert
    sor: [Learning system]
    writers: [{who: site supervisor, via: upload}]
    copies:
    - {system: Crew scheduling, refresh: weekly,
       owner: Energy Services HSE director,
       deletion: scheduling archive}
    agent_reads: Crew scheduling
    agent_acts: true
  agent_stores:
  - {store: Chatbot vendor transcripts,
     holds: [home_address, bank_account]}
