# Shadow plan for the attrition model, fixed Friday,
# July 9, 2027, before the first score (synthetic).
system: attrition model v1 (people analytics)
owner: Tom Reilly, Head of People Analytics
comparator: Hyderabad capability center (US lane);
  Hartwell Germany HR, EU tenant (DE lane)
starts: 2027-07-12
min_weeks: 13
score: frozen on day 1; top 10% per lane is a flag
nobody_sees: managers, HR partners, the employee
outcome: voluntary resignation within 13 weeks
criteria:
  benefit: resignation rate among flags at least twice
    the lane's base rate
  groups: among people with the same outcome, flag rate
    of any age group or sex within 0.80 to 1.25 of the
    comparison group
  human_comparison: resignations per flag at least the HR
    partners' watch list
stop_rules:
  - any score, flag or brief reaches a manager
  - a works-council objection in any lane
