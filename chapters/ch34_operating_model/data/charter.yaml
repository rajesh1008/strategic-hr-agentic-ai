       does: PROCESS_OWNER, prepares: PROCESS_OWNER,
       checks: COUNSEL, told: [FORUM, EMPLOYEE_REP],
       record: Line file}
    - {id: D07, decision: change an agent's tool scope,
       decides: PRODUCT_OWNER, does: PLATFORM,
       prepares: OPERATOR, checks: PLATFORM,
