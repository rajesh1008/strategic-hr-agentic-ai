# Hartwell consequential-decision register, version 1.0 (first draft).
# SYNTHETIC. Invented for the book (Strategic HR and Agentic AI, Chapter 11).
#
# One entry per Keep step of the Automate/Keep Line (line_v1.yaml).
# decider:   the role that makes the decision on each case; the case record
#            names the person who held that role on the day.
# reviewer:  a second role that checks the decision before it is issued.
# appeal_to: the role an affected person asks to reconsider; never the decider
#            or the reviewer of the same case.
# window_days: how long the person has to ask.
# told:      what the person is told, in plain words, with the decision.
# reasons:   the reason codes a decider must choose from.
register: Hartwell consequential-decision register
version: "1.0"
line_version: "1.0"
synthetic: true
entries:
- {id: A04, decider: Recruiter, reviewer: Hiring manager, appeal_to: TA operations manager,
   window_days: 30, told: "Who reviewed the application, the criteria used, and how to ask for reconsideration",
   reasons: [minimum requirement not met, stronger applicants on stated criteria, role closed]}
- {id: A05, decider: Recruiter, reviewer: Hiring manager, appeal_to: TA operations manager,
   window_days: 30, told: "That a recruiter decided, the main reason, and how to ask for reconsideration",
   reasons: [minimum requirement not met, stronger applicants on stated criteria, withdrew, role closed]}
- {id: A07, decider: Hiring manager, reviewer: Reward partner, appeal_to: Head of TA,
   window_days: 10, told: "The offer terms and who to contact about them",
   reasons: [band point by experience, band point by market data]}
- {id: A08, decider: Head of TA, reviewer: Employment counsel, appeal_to: CPO,
   window_days: 10, told: "The reason, the evidence relied on, and how to respond before it is final",
   reasons: [background-check result, right-to-work failure, role eliminated]}
- {id: B02, decider: HR Shared Services lead, reviewer: Employment counsel, appeal_to: HR Director for the country,
   window_days: 10, told: "Which check failed, what evidence would resolve it, and the deadline",
   reasons: [document not verified, permission expired, permission excludes this work]}
- {id: B07, decider: Hiring manager, reviewer: Employment counsel, appeal_to: Head of TA,
   window_days: 10, told: "The result relied on, a copy of the report, and time to dispute it",
   reasons: [result relevant to role, result not relevant to role]}
- {id: C03, decider: Line manager, reviewer: Reward partner, appeal_to: Head of Reward,
   window_days: 30, told: "The band, the point chosen and the reasons",
   reasons: [experience, market data, internal equity]}
- {id: C04, decider: Head of Reward, reviewer: Reward partner, appeal_to: CPO,
   window_days: 30, told: "The decision and the reason",
   reasons: [retention risk, scarce skill, market data]}
- {id: C06, decider: Payroll lead, reviewer: Employment counsel, appeal_to: HR Director for the country,
   window_days: 14, told: "The amount, how it arose, the repayment plan and how to dispute it",
   reasons: [payroll error, leave taken in advance, benefit overpaid]}
- {id: D03, decider: Line manager, reviewer: Line manager, appeal_to: HR business partner,
   window_days: 7, told: "The reason and an alternative date where possible",
   reasons: [cover rule, earlier request, operational need]}
- {id: D04, decider: Leave specialist, reviewer: Head of Benefits, appeal_to: HR Director for the country,
   window_days: 30, told: "The decision, the rule applied and what further evidence would change it",
   reasons: [eligible, not eligible on service, certification incomplete]}
- {id: D06, decider: Accommodation specialist, reviewer: Occupational health, appeal_to: Head of Benefits,
   window_days: 30, told: "The adjustment agreed or the reasons it is not, and the alternatives considered",
   reasons: [agreed as asked, agreed with alternative, undue hardship]}
- {id: E04, decider: Field supervisor, reviewer: Field Operations HR lead, appeal_to: Field Operations HR lead,
   window_days: 2, told: "The shift, the reason and the agreement clause",
   reasons: [no volunteer, emergency cover]}
- {id: E06, decider: Field supervisor, reviewer: HR business partner, appeal_to: null,
   window_days: 0, told: "The points total and the warning",
   reasons: [points threshold]}
- {id: E08, decider: Field Operations HR lead, reviewer: Employment counsel, appeal_to: HR Director for the country,
   window_days: 14, told: "The new hours, the reason and the consultation that took place",
   reasons: [agreed by employee, contract variation after consultation]}
- {id: F03, decider: Line manager, reviewer: Second-line manager, appeal_to: Line manager,
   window_days: 14, told: "The rating and the evidence behind it",
   reasons: [rating per calibrated criteria]}
- {id: F04, decider: Promotion panel, reviewer: HR business partner, appeal_to: Head of Talent Management,
   window_days: 14, told: "The outcome and feedback against the criteria",
   reasons: [criteria met, criteria not met, no vacancy at level]}
- {id: F07, decider: Line manager, reviewer: HR business partner, appeal_to: Second-line manager,
   window_days: 14, told: "The gaps, the support offered, the review dates and the right to be accompanied where it applies",
   reasons: [capability gap documented]}
- {id: G03, decider: Hearing manager, reviewer: Employee relations adviser, appeal_to: Appeal manager,
   window_days: 10, told: "The outcome, the reasons, the evidence and the right of appeal",
   reasons: [no case to answer, informal action, written warning, final warning, dismissal]}
- {id: G04, decider: Investigator, reviewer: Head of Employee Relations, appeal_to: null,
   window_days: 0, told: "The findings that concern them",
   reasons: [upheld, partly upheld, not upheld]}
- {id: G06, decider: Head of Employee Relations, reviewer: Employment counsel, appeal_to: HR Director for the country,
   window_days: 5, told: "That suspension is not a finding, the pay position and the review date",
   reasons: [risk to investigation, risk to people]}
- {id: H04, decider: Hearing manager, reviewer: Employment counsel, appeal_to: Appeal manager,
   window_days: 10, told: "The reason for dismissal, notice, final pay and the right of appeal",
   reasons: [conduct, capability, redundancy, statutory bar, other substantial reason]}
- {id: H05, decider: Selection panel, reviewer: Employment counsel, appeal_to: Employment counsel,
   window_days: 10, told: "The pool, the criteria, their scores and how to challenge them",
   reasons: [selected on agreed criteria]}
