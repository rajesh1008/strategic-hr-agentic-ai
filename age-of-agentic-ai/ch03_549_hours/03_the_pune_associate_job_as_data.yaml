# Strategic HR in the Age of Agentic AI, Chapter 3: 549 Hours
# Listing: The Pune Associate Job, as Data (Under the Hood)
# From Table 3.7. Volume is not split by entry route, which is what the Pune comparison needs.

activity: payroll_exception_clearance
job: Payroll Operations Associate, Pune
routes: [graduate, lateral]
trigger: >-
  a payroll exception, a joiner or leaver
  file, or a statutory change in the queue
decision: >-
  clear under the rule, or send
  to a specialist
inputs:
  - employee record
  - contribution table
  - exception code
volume_and_time: >-
  shared queue, not split by entry route
cost_of_wrong_call: >-
  a missed statutory date or a wrong
  contribution, unwound later
