# Strategic HR in the Age of Agentic AI, Chapter 2: Twenty-One Ideas
# Listing: The Agent Brief as a Spec

agent: draft_answers
role: HR adviser draft
goal: usable drafts on questions advisers write themselves
never:
  - send a draft to an employee without a check
pass_mark: 0.90 on a fresh hand-written set
stop: usable rate on that set falls below 0.90
