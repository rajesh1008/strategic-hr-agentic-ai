[project]
name = "hrai"
version = "0.1.0"
description = "Companion code for The Strategic HR and Agentic AI Handbook (Rajesh Ranjan Mahapatra). All people data is synthetic."
requires-python = ">=3.11"
dependencies = ["anthropic>=0.40", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
markers = ["live: calls the real model API (needs ANTHROPIC_API_KEY); skipped otherwise"]
